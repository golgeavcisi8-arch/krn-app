name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk git autoconf libtool pkg-config zlib1g-dev cmake
        pip install --upgrade pip setuptools buildozer Cython

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/title = My Application/title = krn/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = krnapp/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.krn/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,urllib3,certifi,idna,charset-normalizer/' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: krn-apk
        path: bin/*.apk
